name: build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - 'docker/buildx/**.Dockerfile'
  workflow_run:
    workflows:
      - docker
    branches:
      - master
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: third-party-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  VERSION: '5.1'
  URL_BASE: https://github.com/${{ github.repository }}/releases/download

jobs:
  build_and_upload:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on:
      - self-hosted
      - Linux
      - Large
      - ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - centos7
          - centos8
          #- ubuntu1604
          #- ubuntu1804
          - ubuntu2004
          - ubuntu2204
          - ubuntu2404
        arch:
          - x64
          - arm64
    container:
      image: vesoft/third-party-build:${{ matrix.os }}
    steps:
    - uses: webiny/action-post-run@3.1.0
      with:
        run: find . -mindepth 1 -delete
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    - name: Set up environment
      if: matrix.os == 'centos7'
      run: |
        export URL=https://raw.githubusercontent.com/vesoft-inc/nebula-gears/master/install
        bash <(curl -Ls $URL)
        install-gcc --version=9.5.0
    - name: Pre-Build
      run: |
        mkdir -p _build
        sed -i "s#^URL_BASE=.*#URL_BASE=$URL_BASE#" .env
        sed -i "s#^VERSION=.*#VERSION=$VERSION#" .env
        cat .env
    - name: Build
      run: |
        if [[ "${{ matrix.os }}" == "centos7" ]]; then
          export TOOLSET_GCC_DIR=/opt/vesoft/toolset/gcc/9.5.0
          export CC=${TOOLSET_GCC_DIR}/bin/gcc
          export CXX=${TOOLSET_GCC_DIR}/bin/g++
          export PATH=${TOOLSET_GCC_DIR}/bin:${PATH}
          export LD_LIBRARY_PATH=${TOOLSET_GCC_DIR}/lib64:$LD_LIBRARY_PATH
        fi
        build_package=1 ../build.sh
      working-directory: _build/
    - name: Store packages for release
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ matrix.os }}-${{ matrix.arch }}
        path: _build/packages/*.sh
        if-no-files-found: error
        compression-level: 0
        retention-days: 7

  release:
    needs: build_and_upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_COMMIT }}
    - uses: actions/download-artifact@v4
      with:
        pattern: packages-*
        path: release-assets
        merge-multiple: true
    - name: Prepare installation scripts
      run: |
        sed -i "s#^URL_BASE=.*#URL_BASE=$URL_BASE#" .env
        sed -i "s#^VERSION=.*#VERSION=$VERSION#" .env
        cp .env install-third-party.sh cxx-compiler-abi-version.sh release-assets/
    - name: Publish GitHub Release
      run: |
        release_tag="v$VERSION"
        if ! gh release view "$release_tag" >/dev/null 2>&1; then
          gh release create "$release_tag" --target "$RELEASE_COMMIT" --draft \
            --title "Nebula Third Party $VERSION" \
            --notes "Pre-built third-party packages and installation scripts."
        fi
        for file in install-third-party.sh cxx-compiler-abi-version.sh .env; do
          test -s "release-assets/$file"
        done
        gh release upload "$release_tag" release-assets/*.sh release-assets/.env --clobber
        gh release edit "$release_tag" --draft=false

  repo-dispatch:
    needs: release
    runs-on: ubuntu-latest
    steps:
    - uses: peter-evans/repository-dispatch@v3
      with:
        token: ${{ secrets.GH_PAT }}
        repository: vesoft-inc/nebula-dev-docker
        event-type: nebula-third-party-build
        client-payload: |-
          {
            "version": "${{ env.VERSION }}"
          }
